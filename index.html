<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />

    <!-- Viewport: viewport-fit=cover enables full-bleed on iPhone notch/Dynamic Island.
         maximum-scale=1.0 + user-scalable=no prevent iOS Safari from zooming into inputs. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <title>Tebu.Co – Smart Sugarcane Logistics</title>
    <meta name="description" content="Tebu.Co – PWA untuk manajemen logistik tebu, SPTA digital, dan monitoring armada truk secara realtime." />

    <!-- ── PWA / Install Prompt Requirements ─────────────────────────────── -->
    <!-- Chrome on Android checks theme-color as part of installability criteria -->
    <meta name="theme-color" content="#0a0a0a" />

    <!-- iOS Safari: enables standalone (full-screen) mode when added to home screen -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tebu.Co" />

    <!-- Android Chrome Web App -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Tebu.Co" />

    <!-- iOS home screen icon -->
    <link rel="apple-touch-icon" sizes="192x192" href="/apple-touch-icon.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/pwa-512x512.png" />

    <!-- NOTE: <link rel="manifest"> is injected automatically by vite-plugin-pwa -->
    <!-- Adding it here manually would create a duplicate tag in production build -->

    <!-- ── Google Fonts ───────────────────────────────────────────────────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
